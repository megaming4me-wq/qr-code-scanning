<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Sapphire QR Check-In Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #ffffff;
      text-align: center;
      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(66, 200, 232, 0.22),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          #030a24,
          #061542,
          #183a93
        );
    }

    .scanner-shell {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      color: #f5d97a;
    }

    .subtitle {
      margin: 0 0 22px;
      color: #c9d4e6;
    }

    #reader {
      width: 100%;
      margin: 0 auto;
      overflow: hidden;
      border: 2px solid rgba(
        230,
        189,
        85,
        0.55
      );
      border-radius: 20px;
      background: #ffffff;
      box-shadow:
        0 24px 60px rgba(
          0,
          0,
          0,
          0.42
        );
    }

    #resultPanel {
      display: none;
      min-height: 170px;
      margin-top: 20px;
      padding: 24px;
      border-radius: 18px;
      background: rgba(
        255,
        255,
        255,
        0.97
      );
      color: #17254d;
    }

    #resultPanel.visible {
      display: block;
    }

    #resultPanel.success {
      border: 3px solid #0d8a5f;
    }

    #resultPanel.duplicate {
      border: 3px solid #c48b18;
    }

    #resultPanel.error {
      border: 3px solid #bf2638;
    }

    .result-icon {
      font-size: 52px;
      line-height: 1;
    }

    #resultTitle {
      margin: 12px 0 6px;
      font-size: 26px;
    }

    #resultName {
      margin: 8px 0;
      color: #183a93;
      font-size: 30px;
      font-weight: 900;
    }

    #resultDetails {
      margin: 8px 0 0;
      color: #69738c;
      line-height: 1.6;
    }

    #status {
      margin-top: 18px;
      min-height: 28px;
      color: #f5d97a;
      font-size: 20px;
      font-weight: bold;
    }

    .busy-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      align-items: center;
      justify-content: center;
      background: rgba(
        3,
        10,
        36,
        0.74
      );
    }

    .busy-overlay.visible {
      display: flex;
    }

    .busy-card {
      padding: 25px 35px;
      border: 2px solid #e6bd55;
      border-radius: 18px;
      background: #061542;
      color: #ffffff;
      font-size: 22px;
      font-weight: bold;
      box-shadow:
        0 25px 60px rgba(
          0,
          0,
          0,
          0.5
        );
    }
  </style>
</head>

<body>
  <main class="scanner-shell">
    <h1>Sapphire QR Check-In</h1>

    <p class="subtitle">
      Hold the guest QR code in front of the camera.
    </p>

    <div id="reader"></div>

    <div id="status">
      Select the Logitech camera and begin scanning.
    </div>

    <section
      id="resultPanel"
      aria-live="polite"
    >
      <div
        id="resultIcon"
        class="result-icon">
      </div>

      <h2 id="resultTitle"></h2>

      <div id="resultName"></div>

      <div id="resultDetails"></div>
    </section>
  </main>

  <div
    id="busyOverlay"
    class="busy-overlay"
  >
    <div class="busy-card">
      Checking in...
    </div>
  </div>

  <script>
    let scannerBusy = false;
    let lastTicket = '';
    let lastScanTime = 0;

    const statusBox =
      document.getElementById('status');

    const resultPanel =
      document.getElementById(
        'resultPanel'
      );

    const resultIcon =
      document.getElementById(
        'resultIcon'
      );

    const resultTitle =
      document.getElementById(
        'resultTitle'
      );

    const resultName =
      document.getElementById(
        'resultName'
      );

    const resultDetails =
      document.getElementById(
        'resultDetails'
      );

    const busyOverlay =
      document.getElementById(
        'busyOverlay'
      );

    function extractTicket(decodedText) {
      const raw =
        String(decodedText || '').trim();

      if (!raw) {
        return '';
      }

      const directMatch =
        raw.match(
          /XMAS-2026-\d+/i
        );

      if (directMatch) {
        return directMatch[0]
          .toUpperCase();
      }

      try {
        const scannedUrl =
          new URL(raw);

        const ticket =
          scannedUrl.searchParams.get(
            'ticket'
          );

        return ticket
          ? ticket.trim().toUpperCase()
          : '';

      } catch (error) {
        return '';
      }
    }

    function onScanSuccess(
      decodedText
    ) {
      if (scannerBusy) {
        return;
      }

      const ticket =
        extractTicket(decodedText);

      if (!ticket) {
        showResult({
          success: false,
          status: 'error',
          message:
            'The scanned QR code does not contain a valid invitation code.'
        });

        resumeAfterDelay(2500);
        return;
      }

      const now = Date.now();

      if (
        ticket === lastTicket &&
        now - lastScanTime < 5000
      ) {
        return;
      }

      scannerBusy = true;
      lastTicket = ticket;
      lastScanTime = now;

      busyOverlay.classList.add(
        'visible'
      );

      statusBox.textContent =
        'Checking in ' +
        ticket +
        '...';

      setTimeout(function () {

  busyOverlay.classList.remove(
    'visible'
  );

  showResult({
    success: true,
    status: 'success',
    ticket: ticket,
    fullName: 'Scanner Test',
    department: 'IT Department',
    checkInTime: new Date()
      .toLocaleString(),
    message:
      'Scanner is working.'
  });

  resumeAfterDelay(3000);

}, 1000);

    }

    function showResult(result) {
      const status =
        result && result.status
          ? result.status
          : 'error';

      resultPanel.className =
        'visible ' + status;

      if (
        result &&
        result.success
      ) {
        resultIcon.textContent = '✅';

        resultTitle.textContent =
          'CHECK-IN SUCCESSFUL';

        statusBox.textContent =
          'Guest checked in successfully.';

      } else if (
        status === 'duplicate'
      ) {
        resultIcon.textContent = '⚠️';

        resultTitle.textContent =
          'ALREADY CHECKED IN';

        statusBox.textContent =
          'This QR code was already used.';

      } else {
        resultIcon.textContent = '❌';

        resultTitle.textContent =
          'CHECK-IN FAILED';

        statusBox.textContent =
          result && result.message
            ? result.message
            : 'Check-in failed.';
      }

      resultName.textContent =
        result && result.fullName
          ? result.fullName
          : '';

      const detailLines = [];

      if (
        result &&
        result.ticket
      ) {
        detailLines.push(
          'Invitation Code: ' +
          result.ticket
        );
      }

      if (
        result &&
        result.department
      ) {
        detailLines.push(
          'Department: ' +
          result.department
        );
      }

      if (
        result &&
        result.checkInTime
      ) {
        detailLines.push(
          'Time: ' +
          result.checkInTime
        );
      }

      if (
        result &&
        result.message &&
        !result.success
      ) {
        detailLines.push(
          result.message
        );
      }

      resultDetails.innerHTML =
        detailLines
          .map(function (line) {
            return (
              '<div>' +
              escapeScannerHtml(line) +
              '</div>'
            );
          })
          .join('');
    }

    function resumeAfterDelay(delay) {
      setTimeout(function () {
        resultPanel.className = '';
        resultIcon.textContent = '';
        resultTitle.textContent = '';
        resultName.textContent = '';
        resultDetails.textContent = '';

        statusBox.textContent =
          'Ready to scan next guest...';

        scannerBusy = false;
      }, delay);
    }

function escapeScannerHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

    function onScanFailure() {
      // Normal while the camera searches
      // for a readable QR code.
    }

console.log("Html5QrcodeScanner =", typeof Html5QrcodeScanner);

    if (
  typeof Html5QrcodeScanner ===
  'undefined'
) {
  statusBox.textContent =
    'QR Scanner library failed to load.';
} else {

  const scanner =
    new Html5QrcodeScanner(
      'reader',
      {
        fps: 12,
        qrbox: {
          width: 320,
          height: 320
        },
        rememberLastUsedCamera: true,
        showTorchButtonIfSupported: true,
        supportedScanTypes: [
          Html5QrcodeScanType.SCAN_TYPE_CAMERA
        ]
      },
      false
    );

  scanner.render(
    onScanSuccess,
    onScanFailure
  );
}
  </script>
</body>
</html>
